name: Build VST3 Windows
on:
  push:
  workflow_dispatch:
jobs:
  build-macos:
    runs-on: macos-15-intel   # Mac Intel : file Apple Silicon saturée (binaire universel quand même)
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure (binaire universel Intel + Apple Silicon)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Signature locale (ad-hoc) et nettoyage
        run: |
          VST3=$(find build -type d -name "*.vst3" | head -n 1)
          echo "Plugin trouvé : $VST3"
          xattr -cr "$VST3"
          codesign --force --deep --sign - "$VST3"
          codesign --verify --deep --strict "$VST3"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$VST3" "dist/$(basename "$VST3" .vst3)-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VST3-macOS
          path: dist/*.zip
  win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: WigaRingThink-VST3-Windows
          path: build/RingThingSSB_artefacts/Release/VST3/

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les boutons du README (.../releases/latest/download/RingThink-VST3-<OS>.zip) suivent chaque version.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build-macos, win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: WigaRingThink-VST3-Windows
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: VST3-macOS
          path: dist/mac
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "RingThink-VST3-Windows.zip" ""
          pack dist/mac "RingThink-VST3-macOS.zip" ""
          ls -l *.zip
      - name: Notice
        run: |
          # derniere notice du dossier docs/ (hors guide MIDI), publiee sous un nom fixe
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" RingThink-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="RingThink-VST3-Windows.zip RingThink-VST3-macOS.zip"
          [ -f RingThink-Notice.pdf ] && FILES="$FILES RingThink-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "Ring Think $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi
